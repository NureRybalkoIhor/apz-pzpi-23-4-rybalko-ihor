version: '3.8'

services:
  # Load Balancer to distribute traffic between scaled API replicas
  nginx-lb:
    image: nginx:alpine
    container_name: foodpreorder-lb
    ports:
      - "5082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: always

  # Scaled Backend Application
  api:
    image: foodpreorder-api:latest
    build:
      context: ../../../../Test2/FoodPreOrder
      dockerfile: Dockerfile
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=FoodPreOrderDB;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;MultipleActiveResultSets=true;Max Pool Size=100
      - Jwt__Key=G2453bhsdfkYGhasdr5asjjiksdfni12babsdjiajkkaloksdluwkasnhh6126bd
    depends_on:
      - db
    restart: always

  # Database Engine (MS SQL Server)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: foodpreorder-db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Pass123
    volumes:
      - mssql-data:/var/opt/mssql
    restart: always

volumes:
  mssql-data:
    driver: local
